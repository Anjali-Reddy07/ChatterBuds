<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="100%" stop-color="#161e2e"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#212d45" stroke-width="6"/>
  <!-- Earbud Headset Icon -->
  <path d="M140 260 C140 170, 210 120, 256 120 C302 120, 372 170, 372 260" fill="none" stroke="url(#brand)" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Left Earbud -->
  <rect x="110" y="250" width="56" height="90" rx="28" fill="url(#brand)"/>
  <!-- Right Earbud -->
  <rect x="346" y="250" width="56" height="90" rx="28" fill="url(#brand)"/>
  <!-- Soundwaves center -->
  <line x1="216" y1="230" x2="216" y2="290" stroke="#06b6d4" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="200" x2="256" y2="320" stroke="#10b981" stroke-width="14" stroke-linecap="round"/>
  <line x1="296" y1="230" x2="296" y2="290" stroke="#06b6d4" stroke-width="12" stroke-linecap="round"/>
</svg>
